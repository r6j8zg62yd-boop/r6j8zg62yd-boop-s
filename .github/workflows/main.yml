name: CI

on:
  push:
  pull_request:

jobs:
  grok-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Optional Grok responses sample
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "XAI_API_KEY is not configured; skipping sample request."
            exit 0
          fi
          curl --fail-with-body https://api.x.ai/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $XAI_API_KEY" \
            -d '{"model":"grok-4.7","input":"Fix this function and explain the bug: function median(a){a.sort();return a[a.length/2]}"}'
